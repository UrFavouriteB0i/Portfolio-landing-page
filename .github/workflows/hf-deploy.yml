name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]
    paths:
      - 'ai-chatbot/**' # Only trigger when backend changes

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to HF Space
        run: |
          cd ai-chatbot
          git init
          git config user.name "GitHub Action"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Deploy from monorepo"
          git push --force https://UrFavB0i:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/UrFavB0i/portfolio-chat-backend HEAD:main